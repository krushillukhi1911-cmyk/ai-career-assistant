services:
  - type: web
    name: ai-career-assistant-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./ai_career_assistant.db
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
