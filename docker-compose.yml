services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_career_assistant_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aicareerassistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicareerassistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_career_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aicareerassistant
      - SECRET_KEY=production-super-secret-key-ai-career-assistant-2026
      - LLM_PROVIDER=mock
      - LLM_API_KEY=${LLM_API_KEY}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_store_data:/app/vector_store_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_career_assistant_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
